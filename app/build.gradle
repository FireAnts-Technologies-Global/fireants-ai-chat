plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-parcelize'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

apply from: 'variants-signing.gradle'

android {
    compileSdk compile_sdk_version

    def customStoreFile = project.findProperty("AI_GIRL_STORE_FILE")
    def customStorePassword = project.findProperty("AI_GIRL_STORE_PASSWORD")
    def customKeyAlias = project.findProperty("AI_GIRL_KEY_ALIAS")
    def customKeyPassword = project.findProperty("AI_GIRL_KEY_PASSWORD")
    def hasCustomSigning = [customStoreFile, customStorePassword, customKeyAlias, customKeyPassword].every {
        it != null && it.toString().trim()
    }

    signingConfigs {
        if (hasCustomSigning) {
            fireants {
                storeFile rootProject.file(customStoreFile.toString())
                storePassword customStorePassword.toString()
                keyAlias customKeyAlias.toString()
                keyPassword customKeyPassword.toString()
            }
        }
    }

    defaultConfig {
        applicationId "com.pegas.yuki.virtual.chat"
        minSdkVersion min_sdk_version
        targetSdk target_sdk_version
        versionCode 100
        versionName "1.0.0"

        def formattedDate = new Date().format('MM.dd.yyyy')
        archivesBaseName = "AI_Girl_Friend_Project_v${versionName}_v${versionCode}_${formattedDate}"

        buildConfigField "String", "ANR_STUDIO_VERSION", "\"$fireants_ads_sdk\""
        buildConfigField "String", "PLAY_SERVICES_ADS_VERSION", "\"$play_services_ads_version\""
        buildConfigField "String", "GDPR_MODULE_VERSION", "\"$fireants_consent\""
        buildConfigField "String", "BASE_URL", "\"https://api-chat.fireants.vn/api/v1/\""
        def revenueCatPublicApiKey = project.findProperty("REVENUECAT_ANDROID_PUBLIC_API_KEY")?.toString()?.trim() ?: ""
        buildConfigField "String", "REVENUECAT_PUBLIC_API_KEY", "\"${revenueCatPublicApiKey}\""
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    buildTypes {
        def BOOLEAN = "boolean"
        def TRUE = "true"
        def FALSE = "false"
        def DEV_MODE = "DEV_MODE"

        debug {
            buildConfigField "String", "email_feedback", "\"longtq2609@gmail.com\""
            manifestPlaceholders = [app_id: "ca-app-pub-7988764211742191~6344476054"]
            buildConfigField "Boolean", "build_debug", "true"
            buildConfigField(BOOLEAN, DEV_MODE, TRUE)
            versionNameSuffix '-dev'
            minifyEnabled false
            if (hasCustomSigning) {
                signingConfig signingConfigs.fireants
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
        }

        release {
            buildConfigField "String", "email_feedback", "\"longtq2609@gmail.com\""
            manifestPlaceholders = [app_id: "ca-app-pub-7988764211742191/9278112800"]
            buildConfigField "Boolean", "build_debug", "false"
            buildConfigField(BOOLEAN, DEV_MODE, FALSE)
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            firebaseCrashlytics {
                mappingFileUploadEnabled true
            }
            signingConfig hasCustomSigning ? signingConfigs.fireants : signingConfigs.debug
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }

    buildFeatures {
        dataBinding = true
        viewBinding = true
        buildConfig = true
        compose = true
    }
    namespace 'com.pegas.yuki.virtual.chat'
}

dependencies {
    implementation 'com.fireants:dev-config:1.0.1'
    implementation "com.fireants:consent:$fireants_consent"
    implementation "com.fireants:ads:$fireants_ads_sdk"

    // Local AAR modules
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])

    // AndroidX Core
    implementation "androidx.core:core-ktx:$androidx_core_ktx_version"
    implementation "androidx.appcompat:appcompat:$androidx_appcompat_version"
    implementation "com.google.android.material:material:$androidx_material_version"
    implementation "androidx.recyclerview:recyclerview:$androidx_recyclerview_version"
    implementation "androidx.multidex:multidex:$androidx_multidex_version"

    // Hilt
    implementation "com.google.dagger:hilt-android:$hilt_version"
    ksp "com.google.dagger:hilt-compiler:$hilt_version"

    // Retrofit and OkHttp
    implementation(platform("com.squareup.okhttp3:okhttp-bom:$okhttp_bom_version"))
    implementation("com.squareup.okhttp3:okhttp")
    implementation("com.squareup.okhttp3:logging-interceptor")
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.jakewharton.retrofit:retrofit2-kotlin-coroutines-adapter:$retrofit_kotlin_coroutines_adapter_version"
    implementation "com.squareup.retrofit2:converter-moshi:$retrofit_version"
    implementation "com.github.skydoves:sandwich:$sandwich_version"
    implementation "com.github.skydoves:sandwich-retrofit:$sandwich_version"

    // Moshi
    ksp "com.squareup.moshi:moshi-kotlin-codegen:$moshi_version"
    implementation "com.squareup.moshi:moshi:$moshi_version"
    implementation "com.squareup.moshi:moshi-kotlin:$moshi_version"
    implementation "com.squareup.moshi:moshi-adapters:$moshi_version"

    // Coroutine
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"

    // Glide
    implementation "com.github.bumptech.glide:glide:$glide_version"
    ksp "com.github.bumptech.glide:compiler:$glide_version"

    // Room
    implementation "androidx.room:room-runtime:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    // Timber
    implementation "com.jakewharton.timber:timber:$timber_version"

    // Permissions
    implementation "io.github.impeterwayne:xxpermission-ktx:$xxpermission_ktx_version"

    // UI Libraries
    implementation "de.hdodenhof:circleimageview:$circleimageview_version"

    // Firebase
    implementation platform("com.google.firebase:firebase-bom:$firebase_bom_version")
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-config'

    // Ads
    implementation "com.google.android.play:review-ktx:$play_review_ktx_version"
    implementation "com.facebook.shimmer:shimmer:$shimmer_version"
    implementation "com.google.android.gms:play-services-ads:$play_services_ads_version"

    // Billing
    implementation "com.android.billingclient:billing:$billing_version"
    implementation "com.revenuecat.purchases:purchases:$revenuecat_version"

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$androidx_lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$androidx_lifecycle_version"
    implementation "androidx.fragment:fragment-ktx:$androidx_fragment_ktx_version"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$lifecycle_runtime_compose_version"

    // Lottie
    implementation "com.airbnb.android:lottie:$lottie_version"

    // Rate
    implementation "com.github.ome450901:SimpleRatingBar:$simpleratingbar_version"

    // Media
    implementation "androidx.media3:media3-exoplayer:$media3_exoplayer_version"
    implementation "androidx.media3:media3-ui:$media3_ui_version"

    // BlurView
    implementation "com.github.Dimezis:BlurView:$blurview_version"

    // ShapeView
    implementation 'io.github.impeterwayne:shape-view:1.0.0'

    // Compose
    implementation platform("androidx.compose:compose-bom:$compose_bom_version")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended:$material_icons_extended_version"
    implementation "androidx.activity:activity-compose:$activity_compose_version"
    implementation "androidx.navigation:navigation-compose:$nav_version"
    implementation "androidx.hilt:hilt-navigation-compose:$hilt_navigation_compose_version"
    implementation "io.coil-kt:coil-compose:$coil_compose_version"
    implementation("com.airbnb.android:lottie-compose:6.7.1")
    debugImplementation "androidx.compose.ui:ui-tooling"
    implementation("dev.chrisbanes.haze:haze:1.7.2")
}
